<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real City Simulator</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:black;
}

#loading{
    position:absolute;
    inset:0;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#loading h1{
    font-size:55px;
    color:#00ffcc;
    margin-bottom:15px;
}

#loading p{
    opacity:.7;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    z-index:10;
    background:rgba(0,0,0,.45);
    padding:12px 18px;
    border-radius:14px;
    backdrop-filter:blur(10px);
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:28px;
    z-index:10;
}

button{
    margin-top:20px;
    padding:14px 30px;
    border:none;
    border-radius:14px;
    background:#00ffcc;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="loading">
    <h1>REAL CITY SIMULATOR</h1>
    <p>🌆 Realistic Open World Experience</p>
    <button id="startBtn">START GAME</button>
</div>

<div id="hud">
    ❤️ Health: 100 <br>
    💰 Money: 500 <br>
    🚶 NPC: Alive
</div>

<div id="crosshair">+</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { PointerLockControls }
from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0xa0a0a0,50,250);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// LIGHTING

const hemiLight = new THREE.HemisphereLight(
0xffffff,
0x444444,
2
);

hemiLight.position.set(0,200,0);

scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(
0xffffff,
2
);

dirLight.position.set(-100,100,-100);

dirLight.castShadow = true;

scene.add(dirLight);


// GROUND

const ground = new THREE.Mesh(

new THREE.PlaneGeometry(1000,1000),

new THREE.MeshStandardMaterial({
color:0x555555
})

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


// ROADS

for(let i=-500;i<500;i+=120){

    const road = new THREE.Mesh(

        new THREE.BoxGeometry(1000,1,30),

        new THREE.MeshStandardMaterial({
            color:0x222222
        })

    );

    road.position.set(0,0.02,i);

    scene.add(road);


    const road2 = new THREE.Mesh(

        new THREE.BoxGeometry(30,1,1000),

        new THREE.MeshStandardMaterial({
            color:0x222222
        })

    );

    road2.position.set(i,0.02,0);

    scene.add(road2);
}


// BUILDINGS

for(let i=0;i<200;i++){

    const height = Math.random()*80 + 20;

    const building = new THREE.Mesh(

        new THREE.BoxGeometry(

            Math.random()*20+10,
            height,
            Math.random()*20+10

        ),

        new THREE.MeshStandardMaterial({

            color:new THREE.Color(

                Math.random()*0.5 + 0.3,
                Math.random()*0.5 + 0.3,
                Math.random()*0.5 + 0.3

            )

        })

    );

    building.position.set(

        (Math.random()-0.5)*900,
        height/2,
        (Math.random()-0.5)*900

    );

    building.castShadow = true;

    scene.add(building);
}


// TREES

for(let i=0;i<80;i++){

    const trunk = new THREE.Mesh(

        new THREE.CylinderGeometry(1,1,10),

        new THREE.MeshStandardMaterial({
            color:0x6b4423
        })

    );

    trunk.position.set(

        (Math.random()-0.5)*900,
        5,
        (Math.random()-0.5)*900

    );

    scene.add(trunk);


    const leaves = new THREE.Mesh(

        new THREE.SphereGeometry(5),

        new THREE.MeshStandardMaterial({
            color:0x1fa32a
        })

    );

    leaves.position.set(
        trunk.position.x,
        13,
        trunk.position.z
    );

    scene.add(leaves);
}


// NPC PEOPLE

const npcs = [];

for(let i=0;i<30;i++){

    const npc = new THREE.Group();

    // body

    const body = new THREE.Mesh(

        new THREE.BoxGeometry(2,5,1.5),

        new THREE.MeshStandardMaterial({
            color:Math.random()*0xffffff
        })

    );

    body.position.y = 3;

    npc.add(body);


    // head

    const head = new THREE.Mesh(

        new THREE.SphereGeometry(1),

        new THREE.MeshStandardMaterial({
            color:0xffd2a1
        })

    );

    head.position.y = 7;

    npc.add(head);

    npc.position.set(

        (Math.random()-0.5)*300,
        0,
        (Math.random()-0.5)*300

    );

    npc.userData = {

        speed:Math.random()*0.1 + 0.03,
        direction:Math.random()*Math.PI*2

    };

    scene.add(npc);

    npcs.push(npc);
}


// CARS

const cars = [];

for(let i=0;i<15;i++){

    const car = new THREE.Mesh(

        new THREE.BoxGeometry(6,2,10),

        new THREE.MeshStandardMaterial({

            color:Math.random()*0xffffff

        })

    );

    car.position.set(

        (Math.random()-0.5)*300,
        1,
        (Math.random()-0.5)*300

    );

    car.userData = {

        speed:Math.random()*0.3 + 0.1
    };

    scene.add(car);

    cars.push(car);
}


// PLAYER CONTROLS

const controls = new PointerLockControls(
camera,
document.body
);

document.getElementById("startBtn")
.addEventListener("click",()=>{

    controls.lock();

    document.getElementById("loading")
    .style.display = "none";
});

scene.add(controls.getObject());

camera.position.y = 10;

const keys = {};

document.addEventListener("keydown",(e)=>{

    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",(e)=>{

    keys[e.key.toLowerCase()] = false;
});


// ANIMATION LOOP

function animate(){

    requestAnimationFrame(animate);

    // PLAYER MOVE

    if(keys["w"]) controls.moveForward(0.7);

    if(keys["s"]) controls.moveForward(-0.7);

    if(keys["a"]) controls.moveRight(-0.7);

    if(keys["d"]) controls.moveRight(0.7);


    // NPC MOVEMENT

    npcs.forEach((npc)=>{

        npc.position.x +=
        Math.cos(npc.userData.direction)
        * npc.userData.speed;

        npc.position.z +=
        Math.sin(npc.userData.direction)
        * npc.userData.speed;

        if(Math.random() < 0.01){

            npc.userData.direction =
            Math.random()*Math.PI*2;
        }
    });


    // CAR MOVEMENT

    cars.forEach((car)=>{

        car.position.x += car.userData.speed;

        if(car.position.x > 500){

            car.position.x = -500;
        }
    });

    renderer.render(scene,camera);
}

animate();


// RESIZE

window.addEventListener("resize",()=>{

    camera.aspect =
    window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
