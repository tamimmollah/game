<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bangla Open World Simulator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:black;
}

canvas{
    display:block;
}

#loading{

    position:absolute;
    inset:0;

    background:black;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    color:white;

    z-index:100;
}

#loading h1{

    font-size:65px;

    color:#00ffcc;

    margin-bottom:20px;

    text-shadow:0 0 25px #00ffcc;
}

#loading p{

    opacity:.7;

    margin-bottom:20px;
}

#playBtn{

    padding:16px 35px;

    border:none;

    border-radius:15px;

    background:#00ffcc;

    font-size:20px;

    cursor:pointer;

    font-weight:bold;
}

#hud{

    position:absolute;

    top:15px;
    left:15px;

    color:white;

    background:rgba(0,0,0,.45);

    padding:14px 20px;

    border-radius:14px;

    z-index:10;

    backdrop-filter:blur(8px);
}

#crosshair{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:30px;

    z-index:20;
}

#voice{

    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.6);

    color:white;

    padding:12px 18px;

    border-radius:14px;

    z-index:20;

    font-size:18px;
}

</style>
</head>

<body>

<div id="loading">

<h1>BANGLA CITY LIFE</h1>

<p>🌆 Realistic Open World Experience</p>

<button id="playBtn">
ENTER CITY
</button>

</div>

<div id="hud">

<div>❤️ Health: <span id="health">100</span></div>

<div>⭐ Wanted: <span id="wanted">0</span></div>

<div>💰 Money: <span id="money">500</span></div>

<div>🚗 Vehicle: Available</div>

</div>

<div id="crosshair">+</div>

<div id="voice">
🗣️ লোকজন: "এই ভাই কই যান?" 
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { PointerLockControls }

from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/PointerLockControls.js';


// SCENE

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb,50,600);


// CAMERA

const camera = new THREE.PerspectiveCamera(

75,

window.innerWidth/window.innerHeight,

0.1,

2000
);


// RENDERER

const renderer = new THREE.WebGLRenderer({

antialias:true

});

renderer.setSize(

window.innerWidth,

window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// LIGHTING

const hemiLight = new THREE.HemisphereLight(

0xffffff,

0x444444,

2
);

scene.add(hemiLight);

const sun = new THREE.DirectionalLight(

0xffffff,

2
);

sun.position.set(100,150,100);

sun.castShadow = true;

scene.add(sun);


// GROUND

const ground = new THREE.Mesh(

new THREE.PlaneGeometry(3000,3000),

new THREE.MeshStandardMaterial({

color:0x3f704d

})

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


// ROADS

for(let i=-1400;i<1400;i+=150){

const road = new THREE.Mesh(

new THREE.BoxGeometry(3000,1,40),

new THREE.MeshStandardMaterial({

color:0x222222

})

);

road.position.set(0,0.05,i);

scene.add(road);


const road2 = new THREE.Mesh(

new THREE.BoxGeometry(40,1,3000),

new THREE.MeshStandardMaterial({

color:0x222222

})

);

road2.position.set(i,0.05,0);

scene.add(road2);

}


// BUILDINGS

for(let i=0;i<500;i++){

const h = Math.random()*150 + 20;

const building = new THREE.Mesh(

new THREE.BoxGeometry(

Math.random()*40+10,

h,

Math.random()*40+10

),

new THREE.MeshStandardMaterial({

color:new THREE.Color(

Math.random()*0.7,

Math.random()*0.7,

Math.random()*0.7

)

})

);

building.position.set(

(Math.random()-0.5)*2500,

h/2,

(Math.random()-0.5)*2500

);

building.castShadow = true;

scene.add(building);

}


// TREES

for(let i=0;i<150;i++){

const trunk = new THREE.Mesh(

new THREE.CylinderGeometry(1,1,10),

new THREE.MeshStandardMaterial({

color:0x6b4423

})

);

trunk.position.set(

(Math.random()-0.5)*2500,

5,

(Math.random()-0.5)*2500

);

scene.add(trunk);


const leaf = new THREE.Mesh(

new THREE.SphereGeometry(5),

new THREE.MeshStandardMaterial({

color:0x1fa32a

})

);

leaf.position.set(

trunk.position.x,

13,

trunk.position.z

);

scene.add(leaf);

}


// NPCS

const npcs = [];

const dialogues = [

"এই ভাই কেমন আছেন?",

"ঢাকা শহরে ট্রাফিক অনেক!",

"চা খাবেন নাকি ভাই?",

"আজকে অনেক গরম!",

"এই রাস্তা দিয়ে যাবেন না!",

"ভাই সাবধানে গাড়ি চালান!"

];

for(let i=0;i<80;i++){

const npc = new THREE.Group();


// BODY

const body = new THREE.Mesh(

new THREE.BoxGeometry(2,5,1.5),

new THREE.MeshStandardMaterial({

color:Math.random()*0xffffff

})

);

body.position.y = 3;

npc.add(body);


// HEAD

const head = new THREE.Mesh(

new THREE.SphereGeometry(1),

new THREE.MeshStandardMaterial({

color:0xffcc99

})

);

head.position.y = 7;

npc.add(head);


npc.position.set(

(Math.random()-0.5)*800,

0,

(Math.random()-0.5)*800

);

npc.userData = {

speed:Math.random()*0.12 + 0.03,

direction:Math.random()*Math.PI*2,

dialogue:dialogues[

Math.floor(Math.random()*dialogues.length)

]

};

scene.add(npc);

npcs.push(npc);

}


// CARS

const cars = [];

for(let i=0;i<35;i++){

const car = new THREE.Mesh(

new THREE.BoxGeometry(5,2,10),

new THREE.MeshStandardMaterial({

color:Math.random()*0xffffff

})

);

car.position.set(

(Math.random()-0.5)*800,

1,

(Math.random()-0.5)*800

);

car.userData = {

speed:Math.random()*0.8 + 0.2

};

scene.add(car);

cars.push(car);

}


// CONTROLS

const controls = new PointerLockControls(

camera,

document.body
);

scene.add(controls.getObject());

camera.position.y = 10;

document.getElementById("playBtn")

.addEventListener("click",()=>{

controls.lock();

document.getElementById("loading")

.style.display = "none";

});


// PLAYER

let health = 100;

let wanted = 0;

let money = 500;


// KEYS

const keys = {};

document.addEventListener("keydown",(e)=>{

keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup",(e)=>{

keys[e.key.toLowerCase()] = false;

});


// SHOOT

document.addEventListener("click",()=>{

wanted++;

document.getElementById("wanted")

innerText = wanted;

});


// NPC TALK

setInterval(()=>{

const npc = npcs[

Math.floor(Math.random()*npcs.length)

];

document.getElementById("voice")

innerHTML =

"🗣️ লোকজন: \"" +

npc.userData.dialogue +

"\"";

},4000);


// GAME LOOP

function animate(){

requestAnimationFrame(animate);


// PLAYER MOVE

if(keys["w"]) controls.moveForward(1);

if(keys["s"]) controls.moveForward(-1);

if(keys["a"]) controls.moveRight(-1);

if(keys["d"]) controls.moveRight(1);


// NPC MOVE

npcs.forEach((npc)=>{

npc.position.x +=

Math.cos(npc.userData.direction)

* npc.userData.speed;

npc.position.z +=

Math.sin(npc.userData.direction)

* npc.userData.speed;

if(Math.random()<0.01){

npc.userData.direction =

Math.random()*Math.PI*2;

}

});


// CAR MOVE

cars.forEach((car)=>{

car.position.x += car.userData.speed;

if(car.position.x > 1500){

car.position.x = -1500;

}

});


// RANDOM DAMAGE

if(Math.random()<0.003){

health--;

document.getElementById("health")

.innerText = health;

}


// RANDOM MONEY

if(Math.random()<0.002){

money += 50;

document.getElementById("money")

.innerText = money;

}


renderer.render(scene,camera);

}

animate();


// RESIZE

window.addEventListener("resize",()=>{

camera.aspect =

window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(

window.innerWidth,

window.innerHeight
);

});

</script>

</body>
</html>
